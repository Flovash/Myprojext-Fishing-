/* Layout: the game's own fish guide. Home = groups of fish cards drawn by the game's renderer; tap one for its own page (attitude -> route -> screen -> rules); a strategy board stacks routes. Single deep-water theme on purpose, same as the cabinet. */
:root {
  color-scheme: dark;
  --bg: #062631; --card: #0f3240; --card-hi: #144050; --line: #1f4b5a; --ink: #eef6f8; --muted: #9dbac2; --faint: #6f909a;
  --water: #0b3d4a; --water-edge: #2a6a78; --seat: #8fb3bb; --accent: #ffb547; --accent-ink: #2a1800; --warn: #ff7a70; --ok: #8fe08a;
  --g-tiny: #c9d3d8; --g-small: #7ddc6a; --g-medium: #4fb3ff; --g-big: #ffc94a; --g-boss: #ff5a5a; --g-special: #ff8fc8;
  --display: "Bungee", "Arial Black", Impact, sans-serif;
  --body: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --c-shark:#f0997b;--c-manta:#afa9ec;--c-hammerhead:#c4c2b9;--c-marlin:#7aa6ff;--c-tuna:#7fb2ff;--c-barracuda:#e8eef0;--c-octopus:#ff8f70;--c-swordfish:#85b7eb;--c-turtle:#97c459;--c-sardine:#dfe8ec;--c-angelfish:#8cc4ea;
  --c-anchovy:#8fb8ea;--c-clownfish:#ff8a2a;--c-butterflyfish:#ffe14a;--c-minnow:#8fd19a;--c-pufferfish:#e0c27a;--c-lionfish:#f39a8a;--c-seahorse:#f29ac0;--c-bombcrab:#ff7a50;--c-eel:#fff176;--c-healer:#7fffd8;--c-megalodon:#b8c6d2;--c-giantsquid:#ff8fa3;--c-kraken:#c7a8ff;--c-koi:#ffd24a;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 44px; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { max-width: 1180px; margin: 0 auto; display: grid; gap: 18px; }
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; }
.brand { display: grid; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(28px, 5vw, 42px); line-height: 1; margin: 2px 0 0; color: var(--accent); }
.nav { display: flex; gap: 6px; }
.nav a { text-decoration: none; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 5px 14px 4px; font-weight: 700; }
.nav a[aria-current="page"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.law0 { margin: 0; font-size: 14px; color: var(--muted); }
/* home grid */
.ghead { display: flex; align-items: baseline; gap: 8px; margin: 6px 0 8px; font-size: 22px; font-weight: 600; }
.ghead small { font-size: 22px; }
.grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; }
.fcard { display: grid; justify-items: center; gap: 0; padding: 10px 6px 10px; background: var(--card); border: 1px solid transparent; border-radius: 12px; text-decoration: none; text-align: center; transition: background .15s, border-color .15s, transform .15s; }
.fcard:hover { background: var(--card-hi); border-color: var(--line); transform: translateY(-2px); }
.fcard canvas { width: 100%; max-width: 230px; height: auto; aspect-ratio: 2 / 1; display: block; }
.fcard .fname { font-weight: 800; font-size: 18px; line-height: 1.1; margin-top: -4px; }
.fcard .fpay { font-size: 14px; color: var(--muted); font-weight: 600; }
.fcard .fn { font-family: var(--mono); font-size: 11px; color: var(--faint); }
/* fish page */
.back { text-decoration: none; font-weight: 700; color: var(--muted); }
.hero { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 18px; align-items: center; background: var(--card); border-radius: 16px; padding: 14px 18px; }
.hero canvas { width: 100%; height: auto; aspect-ratio: 2 / 1; display: block; }
.hero h2 { font-family: var(--display); font-weight: 400; font-size: clamp(26px, 4.4vw, 40px); line-height: 1.05; margin: 0; }
.hero .meta { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; margin: 6px 0 10px; }
.pill { font-family: var(--mono); font-size: 12px; border: 1px solid currentColor; border-radius: 6px; padding: 1px 7px; }
.facts { display: grid; gap: 6px; margin: 0; }
.facts dt { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.facts dd { margin: 0 0 4px; }
.cols { display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: 18px; align-items: start; }
.cols > * { min-width: 0; }
.panel { background: var(--card); border-radius: 14px; padding: 14px; display: grid; gap: 12px; }
.step { display: grid; gap: 8px; }
.stephead { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.num { font-family: var(--display); font-size: 13px; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); padding-top: 2px; flex: none; }
h3 { font-size: 19px; margin: 0; font-weight: 700; }
.hint { font-size: 13px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px 3px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); font-size: 15px; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.chip small { font-family: var(--mono); font-size: 11px; opacity: .75; }
.routes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.rcard { text-align: left; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); padding: 6px 6px 8px; display: grid; gap: 3px; }
.rcard[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
.rcard svg { width: 100%; height: auto; display: block; }
.rname { font-weight: 700; font-size: 15px; line-height: 1.15; }
.rmeta { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.screen { background: var(--card); border-radius: 14px; padding: 12px; display: grid; gap: 8px; }
.screen svg { width: 100%; height: auto; display: block; }
.stitle { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.stitle h3 { font-size: 21px; }
.status { font-family: var(--mono); font-size: 11px; text-transform: uppercase; border: 1px solid currentColor; border-radius: 6px; padding: 1px 6px; color: var(--muted); }
.status.live { color: var(--ok); }
.controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 5px 11px 4px; font-size: 14px; font-weight: 600; }
.btn[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--bg); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.clock { font-family: var(--mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; margin-left: auto; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
.rules { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.rules > section { background: var(--card); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.rules h4 { margin: 0; font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); font-weight: 500; }
.rules p { margin: 0; }
.rules ul { margin: 0; padding-left: 18px; display: grid; gap: 3px; }
.rules .wide { grid-column: 1 / -1; }
.ifrule { list-style: none; padding-left: 0 !important; }
.ifrule li { padding-left: 26px; position: relative; }
.ifrule li::before { content: "IF"; position: absolute; left: 0; top: 3px; font-family: var(--mono); font-size: 10px; border: 1px solid var(--accent); color: var(--accent); border-radius: 4px; padding: 0 3px; }
.lawtable { overflow-x: auto; }
.lawtable table { border-collapse: collapse; width: 100%; font-size: 14px; min-width: 520px; }
.lawtable td { border-top: 1px solid var(--line); padding: 6px 8px 6px 0; vertical-align: top; }
.lawtable code, .val { font-family: var(--mono); font-size: 12px; }
.share { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.share i { display: block; height: 100%; background: var(--accent); }
.layer { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; }
.layer .lname { font-weight: 600; line-height: 1.2; }
.layer .lsub { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.layer canvas { width: 64px; height: 32px; }
.step2 { display: flex; align-items: center; gap: 4px; }
.step2 button { width: 30px; height: 30px; border: 1px solid var(--line); border-radius: 7px; background: var(--card); font-weight: 700; }
.step2 span { font-family: var(--mono); font-size: 12px; min-width: 38px; text-align: center; font-variant-numeric: tabular-nums; }
.checks { display: grid; gap: 4px; font-size: 14px; }
.checks .bad { color: var(--warn); font-weight: 600; }
.checks .good { color: var(--ok); }
.empty { color: var(--muted); font-size: 14px; }
.picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
.picker button { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 4px; display: grid; justify-items: center; font-size: 13px; font-weight: 700; }
.picker canvas { width: 100%; height: auto; aspect-ratio: 2 / 1; }
/* svg */
.water { fill: var(--water); stroke: var(--water-edge); stroke-width: 2; }
.seatmark { stroke: var(--seat); stroke-width: 8; stroke-linecap: round; }
.seatlab { font-family: var(--mono); font-size: 22px; fill: var(--muted); }
.route { fill: none; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
.route.ghost { opacity: .4; }
.mini .route { stroke-width: 12; }
.mini .seatmark { stroke-width: 12; }
.pausedot { stroke: var(--water); stroke-width: 3; }
.edgelab { font-family: var(--mono); font-size: 20px; fill: var(--faint); }
.lanewarn { fill: none; stroke: var(--warn); stroke-width: 3; stroke-dasharray: 8 6; }
@media (max-width: 980px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (max-width: 900px) { .cols, .hero { grid-template-columns: minmax(0, 1fr); } .rules { grid-template-columns: minmax(0, 1fr); } .hero canvas { max-width: 360px; margin: 0 auto; } }
@media (max-width: 720px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; } .fcard .fname { font-size: 15px; } .fcard .fpay { font-size: 12px; } .ghead, .ghead small { font-size: 19px; } }
@media (max-width: 420px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tlwrap { overflow-x: auto; }
.tlwrap svg { display: block; width: 100%; min-width: 760px; height: auto; touch-action: pan-y; user-select: none; }
.tlruler { fill: var(--bg); cursor: pointer; }
.tlgrid { stroke: var(--line); stroke-width: 1; }
.tlgrid.minor { stroke-dasharray: 2 4; }
.tltick { font-family: var(--mono); font-size: 11px; fill: var(--muted); }
.tllab { font-family: var(--body); font-size: 13px; fill: var(--muted); }
.tllab.big { fill: var(--ink); font-weight: 700; }
.tlbar { cursor: grab; }
.tlbar rect { stroke: transparent; stroke-width: 3; }
.tlbar:hover rect, .tlbar.sel rect { stroke: var(--ink); }
.tltag { font-family: var(--mono); font-size: 10px; fill: var(--bg); pointer-events: none; }
.tlshade { fill: var(--c-shark); opacity: .08; pointer-events: none; }
.tlsep { stroke: var(--line); stroke-width: 1; }
.tlhead { stroke: var(--accent); stroke-width: 2.5; pointer-events: none; }
.bcols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 340px); gap: 14px; align-items: start; }
.bcols > * { min-width: 0; }
@media (max-width: 900px) { .bcols { grid-template-columns: minmax(0, 1fr); } }
.tl2 { display: grid; grid-template-columns: 112px minmax(0, 1fr); align-items: start; }

.lock { font-family: var(--mono); font-size: 11px; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }
.tlbar { cursor: pointer; }
.tl2 .tlwrap svg { min-width: 0; width: auto; max-width: none; }
.tlwrap { overscroll-behavior-x: contain; border-radius: 8px; }
.wseg { fill: var(--bg); opacity: .55; cursor: pointer; }
.wseg.alt { fill: var(--card-hi); opacity: .5; }
.wseg.mine { fill: var(--accent); opacity: .08; }
.wtab { fill: var(--card-hi); stroke: var(--line); cursor: pointer; }
.wtab:hover { stroke: var(--accent); }
.wlab { font-family: var(--body); font-size: 13px; font-weight: 700; fill: var(--ink); pointer-events: none; }
.wcheck { display: block; width: 100%; text-align: left; background: none; border: 0; border-radius: 6px; padding: 3px 6px; }
.wcheck.cur { background: var(--bg); outline: 1px solid var(--line); }
.wcheck:hover { background: var(--bg); }
</style>

  $('boardPage').innerHTML = `<div style="display:grid;gap:14px">
    <div class="panel"><div class="stephead"><h3>Master strategy</h3><span class="lock">View only</span><button class="btn" id="zoomBtn" style="margin-left:auto"></button></div><div class="hint">Waves 1–${session.waves.length}, left to right. Tap a wave to jump there. Tap a bar to see that fish.</div>
      <div class="tl2"><svg id="tlLab" aria-hidden="true"></svg><div class="tlwrap" id="tlScroll"><svg id="tl" role="img" aria-label="Session timeline"></svg></div></div>
      <div class="controls" id="selCtl"></div></div>
    <div class="bcols"><div class="screen"><div class="stitle"><h3 id="screenTitle"></h3><span class="hint" id="screenStory"></span></div>${stageHTML('')}</div><div class="panel" id="boardChecks"></div></div></div>`;
  wireStage(); stageLayers = boardLayers; selLayer = -1; lastActive = ''; T = Math.min(T, sessionEnd()); refreshBoard(); scrollToT(true);
}
function refreshBoard() { renderTimeline(); renderSel(); renderChecks(); lastActive = ''; drawFrame(); }
let PX = 9, fit = store.get('fit', true); const TOP = 34;
const ROWS = ['shark', 'manta', 'hammerhead', 'marlin', 'tuna', 'barracuda', 'octopus', 'swordfish', 'turtle'];
function layout() {
  const ls = boardLayers(), rows = ROWS.slice();
  for (const l of ls) if (!rows.includes(l.k)) rows.push(l.k);
  const lanes = {}; for (const k of rows) lanes[k] = [];
  for (const l of ls.slice().sort((a, b) => a.start - b.start)) {
    const end = l.start + timeline(l.r, l.o).dur, ln = lanes[l.k]; let j = ln.findIndex(e => e <= l.start - .5); if (j < 0) { j = ln.length; ln.push(0); } ln[j] = end; l.lane = j;
  }
  let y = TOP; const rowY = {};
  for (const k of rows) { const n = Math.max(1, lanes[k].length); rowY[k] = {y, n, h: n * 14 + 8}; y += n * 14 + 8; }
  return {ls, rows, rowY, h: y + 6};
}
function renderTimeline() {
  const {ls, rows, rowY, h} = layout(), sc = $('tlScroll');
  const end = fit ? sessionEnd() : Math.ceil(sessionEnd() / 10) * 10 + 10;
  PX = fit ? Math.max(.3, (sc.clientWidth - 2) / end) : 9;
  const w = Math.floor(end * PX);
  $('zoomBtn').textContent = fit ? 'Zoom in' : 'See all ' + session.waves.length + ' waves';
  let s = '';
  session.waves.forEach((wv, i) => {
    s += `<rect class="wseg${i % 2 ? ' alt' : ''}${wv.mine ? ' mine' : ''}" data-wave="${i}" x="${wv.t0 * PX}" y="0" width="${(wv.t1 - wv.t0) * PX}" height="${h}"/>`;
    s += `<rect class="wtab" data-wave="${i}" x="${wv.t0 * PX + 2}" y="2" width="${(wv.t1 - wv.t0) * PX - 4}" height="24" rx="6"/><text class="wlab" x="${(wv.t0 + (fit ? (wv.t1 - wv.t0) / 2 : 0)) * PX + (fit ? 0 : 10)}" y="19" text-anchor="${fit ? 'middle' : 'start'}">${(wv.t1 - wv.t0) * PX < 64 ? wv.n : (wv.t1 - wv.t0) * PX < 160 ? 'Wave ' + wv.n : 'Wave ' + wv.n + ' · ' + esc(wv.title).slice(0, Math.floor((wv.t1 - wv.t0) * PX / 7.2) - 9)}</text>`;
  });
  for (let t = 0; t <= end; t += fit ? 30 : 10) s += `<line class="tlgrid" x1="${t * PX}" x2="${t * PX}" y1="${TOP - 4}" y2="${h}"/>`;
  rows.forEach(k => s += `<line class="tlsep" x1="0" x2="${w}" y1="${rowY[k].y + rowY[k].h - 1}" y2="${rowY[k].y + rowY[k].h - 1}"/>`);
  for (const l of ls) {
    const d = timeline(l.r, l.o).dur, x = l.start * PX, bw = Math.max(6, d * PX), y = rowY[l.k].y + 4 + l.lane * 14;
    s += `<g class="tlbar${l.i === selLayer ? ' sel' : ''}" data-li="${l.i}"><rect x="${x}" y="${y}" width="${bw}" height="11" rx="4" fill="${col(l.k)}"/>${bw > 70 ? `<text class="tltag" x="${x + 5}" y="${y + 9}">${esc((l.o.tag && /shadow|pair/i.test(l.o.tag) ? l.o.tag + ' · ' : '') + l.r.name).slice(0, Math.floor(bw / 6))}</text>` : ''}</g>`;
  }
  s += `<line id="tlHead" class="tlhead" x1="${T * PX}" x2="${T * PX}" y1="0" y2="${h}"/>`;
  const svg = $('tl'); svg.setAttribute('width', w); svg.setAttribute('height', h); svg.setAttribute('viewBox', `0 0 ${w} ${h}`); svg.innerHTML = s;
  const LW = matchMedia('(max-width: 560px)').matches ? 84 : 112, lab = $('tlLab'); lab.setAttribute('width', LW); lab.setAttribute('height', h); lab.setAttribute('viewBox', `${112 - LW} 0 ${LW} ${h}`);
  lab.innerHTML = `<text class="tltick" x="104" y="19" text-anchor="end">wave</text>` + rows.map(k => `<text class="tllab${isBig(k) ? ' big' : ''}" x="104" y="${rowY[k].y + 15}" text-anchor="end">${esc(F[k].name)}</text>`).join('');
}
function tlPlayhead() { const hd = $('tlHead'); if (hd) { hd.setAttribute('x1', T * PX); hd.setAttribute('x2', T * PX); } }
function scrollToT(center) {
  const sc = $('tlScroll'); if (!sc) return; const x = T * PX, vw = sc.clientWidth;
  if (center || x < sc.scrollLeft + 30 || x > sc.scrollLeft + vw - 60) sc.scrollLeft = Math.max(0, x - vw * .3);
}
function renderSel() {
  const l = session.layers[selLayer];
  $('selCtl').innerHTML = l ? `<span style="font-weight:700">${esc(F[l.fish].name)} · ${esc((F[l.fish].routes.find(r => r.id === l.route) || {}).name || l.route)}</span><span class="hint">wave ${l.wave}, comes in at ${(l.start - session.waves[l.wave - 1].t0).toFixed(1)} s, stays ${l.dur ? l.dur.toFixed(0) : '?'} s</span><a class="btn" href="#${l.fish}" style="text-decoration:none">Open ${esc(F[l.fish].name)}</a>`
    : `<span class="hint">${session.layers.length} fish across ${session.waves.length} waves, about ${Math.round(sessionEnd() / 60)} minutes.</span>`;
}
function waveIssues(wv) {
  const ls = boardLayers().filter(l => l.start < wv.t1 && l.start + timeline(l.r, l.o).dur > wv.t0), out = [];
  for (let a = 0; a < ls.length; a++) for (let b = a + 1; b < ls.length; b++) {
    const A = ls[a], B = ls[b]; if (!isBig(A.k) || !isBig(B.k)) continue; if (A.k === 'shark' && B.k === 'shark' && /shadow|pincer/i.test((A.o.tag || '') + (B.o.tag || ''))) continue; const c = closest(A, B); if (!c) continue;
    const lim = [A.k, B.k].includes('shark') ? .2 : .14; if (c.d < lim) out.push(`${F[A.k].name} and ${F[B.k].name} within ${(c.d * 1000).toFixed(0)} px`);
  }
  let worst = 0; const bigs = ls.filter(l => isBig(l.k));
  for (let t = wv.t0; t < wv.t1; t += .5) worst = Math.max(worst, bigs.filter(l => { const p = timeline(l.r, l.o).at(t - l.start); return p && p[0] > -.02 && p[0] < 1.02; }).length);
  if (worst > 3) out.push(`${worst} big fish on screen at once`);
  let inRing = 0; for (const sh of ls.filter(l => l.k === 'shark')) for (const m of ls.filter(l => !isBig(l.k))) { const c = closest(sh, m); if (c && c.d < .2) inRing++; }
  if (inRing) out.push(`${inRing} medium${inRing > 1 ? 's' : ''} inside the Shark's 200 px ring`);
  return out;
}
function renderChecks() {
  const cur = waveAt(T);
  $('boardChecks').innerHTML = `<div class="stephead"><h3>Checks against the laws</h3></div><div class="checks">${session.waves.map((wv, i) => { const iss = waveIssues(wv);
    return `<button class="wcheck${wv === cur ? ' cur' : ''}" data-wave="${i}"><span class="${iss.length ? 'bad' : 'good'}">${wv.mine ? 'My plan' : 'Wave ' + wv.n}: ${iss.length ? esc(iss.join('; ')) : 'all clear'}</span></button>`; }).join('')}</div>`;
}
let lastActive = '', lastWave = null;
function boardFrame() {
  if (location.hash !== '#board') return;
  tlPlayhead();
  const act = boardLayers().filter(l => T >= l.start - .5 && T <= l.start + timeline(l.r, l.o).dur + .5);
  const key = act.map(l => l.i).join(',');
  if (key !== lastActive) { lastActive = key; let svg = tank(false); act.forEach(l => { const t = timeline(l.r, l.o); svg += poly(t.s, 'ghost', l.k); }); $('stageSvg').innerHTML = svg; }
  const wv = waveAt(T);
  if (wv !== lastWave) { lastWave = wv; $('screenTitle').textContent = (wv.mine ? 'My plan' : 'Wave ' + wv.n) + ' · ' + wv.title; $('screenStory').textContent = ''; document.querySelectorAll('.wcheck').forEach((b, i) => b.classList.toggle('cur', session.waves[i] === wv)); }
  if (playing) scrollToT(false);
}
(function wireTimeline() {
  document.addEventListener('click', e => {
    const svg = e.target.closest('#tl'); if (!svg) return;
    const bar = e.target.closest('[data-li]');
    if (bar) { const i = +bar.dataset.li; selLayer = selLayer === i ? -1 : i; if (selLayer >= 0) { T = session.layers[i].start + .5; } renderTimeline(); renderSel(); lastActive = ''; drawFrame(); return; }
    const tab = e.target.closest('[data-wave]');
    if (tab) { const wv = session.waves[+tab.dataset.wave]; T = e.target.classList.contains('wtab') ? wv.t0 : Math.max(0, (e.clientX - svg.getBoundingClientRect().left) / PX); lastActive = ''; drawFrame(); }
  });
  document.addEventListener('click', e => { if (e.target.id === 'zoomBtn') { fit = !fit; store.set('fit', fit); renderTimeline(); scrollToT(true); } });
  addEventListener('resize', () => { if (location.hash === '#board' && fit) renderTimeline(); });
})();
function navCount() {}


// ---------- routing ----------
function route() {
  playing = false; gcIcons();
  const h = location.hash.slice(1);
  const isFish = h && F[h], isBoard = h === 'board';
  $('home').hidden = isFish || isBoard; $('fishPage').hidden = !isFish; $('boardPage').hidden = !isBoard;
  $('navFish').setAttribute('aria-current', !isBoard ? 'page' : 'false'); $('navBoard').setAttribute('aria-current', isBoard ? 'page' : 'false');
  $('fishPage').innerHTML = isFish ? $('fishPage').innerHTML : ''; $('boardPage').innerHTML = isBoard ? $('boardPage').innerHTML : '';
  if (isFish) { renderFishPage(h); scrollTo(0, 0); }
  else if (isBoard) { T = 0; renderBoard(); scrollTo(0, 0); }
  gcIcons(); navCount();
}
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.att) { page.att = b.dataset.att; T = 0; fishUpdate(); }
  else if (b.dataset.route) { page.route = b.dataset.route; page.fx = page.fy = page.rev = false; T = 0; fishUpdate(true); if (matchMedia('(max-width: 900px)').matches) $('stitle').scrollIntoView({block: 'start', behavior: reduce ? 'auto' : 'smooth'}); }
  else if (b.dataset.wave != null && b.classList.contains('wcheck')) { T = session.waves[+b.dataset.wave].t0; lastActive = ''; drawFrame(); scrollToT(true); renderChecks(); }
});
addEventListener('hashchange', route);
renderHome(); route(); requestAnimationFrame(iconLoop);
</script>
